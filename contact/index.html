<!DOCTYPE html>
<html class="not-ready dark artwork-root" style="--bg: #010101" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Physical Addons</title>
  <meta name="description" content="Contact Physical Addons about enterprise licences, upgrade discounts and support for our Blender addons." />
  <link rel="canonical" href="https://www.physicaladdons.com/contact/" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/images/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://www.physicaladdons.com/blog/main.min.css" />
  <link rel="stylesheet" href="/submit-your-artwork/artwork.css" />
  <link rel="stylesheet" href="/contact/contact.css" />
  <script defer data-domain="physicaladdons.com" src="/js/script.js"></script>
  <meta name="theme-color" content="#010101" />
</head>
<body class="artwork-body text-black dark:text-white">
  <header class="site-header">
    <nav class="nav-primary nav-primary--closed" aria-label="Primary">
      <a class="nav-primary__logo" href="https://www.physicaladdons.com/psa/" aria-label="Physical Addons">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
          <path
            fill="currentColor"
            d="m266.669 400.001 133.333-66.666V216.668l-133.333 66.667v116.666ZM133.333 0 0 66.667V400l133.333-66.667v-66.666h133.334L400 200V0H133.333Zm0 100h133.334v66.667H133.333V100Z"
          />
        </svg>
      </a>
      <button
        class="nav-primary__toggle"
        aria-controls="primary-nav-links"
        aria-expanded="false"
        aria-label="Toggle primary navigation"
        type="button"
      >
        <svg class="ham" viewBox="0 0 100 100" width="64" aria-hidden="true">
          <path class="ham__line ham__line--top" d="m 70,33 h -40 c 0,0 -8.5,-0.149796 -8.5,8.5 0,8.649796 8.5,8.5 8.5,8.5 h 20 v -20"></path>
          <path class="ham__line ham__line--middle" d="m 70,50 h -40"></path>
          <path class="ham__line ham__line--bottom" d="m 30,67 h 40 c 0,0 8.5,0.149796 8.5,-8.5 0,-8.649796 -8.5,-8.5 -8.5,-8.5 h -20 v 20"></path>
        </svg>
      </button>
      <div class="nav-primary__collapse" id="primary-nav-links">
        <div class="nav-primary__main">
          <a href="https://www.physicaladdons.com/pco/" class="nav-primary__link">Planets</a>
          <a href="https://www.physicaladdons.com/psa/" class="nav-primary__link">Atmosphere</a>
          <a href="https://www.physicaladdons.com/pow/" class="nav-primary__link">Oceans</a>
        </div>
        <div class="nav-primary__secondary">
          <a href="/blog/" class="nav-primary__link nav-primary__link--muted">Blog</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="artwork" id="top">
    <div class="artwork-main">
      <header class="artwork-hero" aria-labelledby="contact-hero-title">
        <h1 class="artwork-hero__title" id="contact-hero-title">Let's talk</h1>
        <p class="artwork-hero__subtitle">Studio licences, upgrades and support</p>
      </header>

      <h2 class="artwork-section__title">Fill this form</h2>

      <form
        class="artwork-form"
        name="contact"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
        action="/contact/success/"
      >
        <input type="hidden" name="form-name" value="contact" />

        <p class="artwork-honeypot" aria-hidden="true">
          <label>Do not fill this in: <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
        </p>

        <label class="artwork-field">
          <span class="artwork-control">
            <span class="artwork-field__label">What is this about?<span aria-hidden="true">*</span></span>
            <select class="artwork-input contact-select" name="topic" id="field-topic" required>
              <option value="" selected disabled>Choose a topic...</option>
              <option value="Enterprise licence" data-topic="enterprise">Enterprise licence</option>
              <option value="Upgrade discount" data-topic="upgrade">Upgrade discount</option>
              <option value="Support" data-topic="support">Support</option>
              <option value="Other" data-topic="other">Other</option>
            </select>
            <span class="artwork-line" aria-hidden="true"></span>
          </span>
          <span class="contact-hint" id="topic-hint" hidden></span>
        </label>

        <label class="artwork-field">
          <span class="artwork-control">
            <span class="artwork-field__label">Name<span aria-hidden="true">*</span></span>
            <input
              class="artwork-input"
              type="text"
              name="name"
              id="field-name"
              placeholder="Write your name..."
              required
              autocomplete="name"
            />
            <span class="artwork-line" aria-hidden="true"></span>
          </span>
        </label>

        <label class="artwork-field">
          <span class="artwork-control">
            <span class="artwork-field__label">Email<span aria-hidden="true">*</span></span>
            <input
              class="artwork-input"
              type="email"
              name="email"
              id="field-email"
              placeholder="email@sample.com"
              required
              autocomplete="email"
            />
            <span class="artwork-line" aria-hidden="true"></span>
          </span>
        </label>

        <label class="artwork-field">
          <span class="artwork-control">
            <span class="artwork-field__label">Company</span>
            <input
              class="artwork-input"
              type="text"
              name="company"
              id="field-company"
              placeholder="Studio or company name, if any"
              autocomplete="organization"
            />
            <span class="artwork-line" aria-hidden="true"></span>
          </span>
        </label>

        <label class="artwork-field">
          <span class="artwork-control">
            <span class="artwork-field__label">Message<span aria-hidden="true">*</span></span>
            <textarea
              class="artwork-input contact-textarea"
              name="message"
              id="field-message"
              rows="4"
              placeholder="Write your message..."
              required
            ></textarea>
            <span class="artwork-line" aria-hidden="true"></span>
          </span>
        </label>

        <div class="artwork-actions">
          <button class="artwork-submit" type="submit">Send</button>
        </div>

        <p class="artwork-footnote">
          For quick questions, ask in our
          <a href="https://discord.gg/wvzPVzj9Vr" target="_blank" rel="noopener">Discord community</a>.
        </p>
      </form>
    </div>
  </main>

  <script>
    (function () {
      setTimeout(function () {
        document.documentElement.classList.remove("not-ready");
      }, 10);

      var navPrimary = document.querySelector(".nav-primary");
      var btnMenu = document.querySelector(".nav-primary__toggle");
      if (navPrimary && btnMenu) {
        btnMenu.addEventListener("click", function () {
          var isExpanded = btnMenu.getAttribute("aria-expanded") === "true";
          var nextState = !isExpanded;
          btnMenu.setAttribute("aria-expanded", nextState ? "true" : "false");
          navPrimary.classList.toggle("nav-primary--open", nextState);
          navPrimary.classList.toggle("nav-primary--closed", !nextState);
          document.body.classList.toggle("navigation-active", nextState);
        });
      }

      // Links such as /contact/?topic=enterprise open the form with that topic selected.
      var topic = document.getElementById("field-topic");
      var hint = document.getElementById("topic-hint");
      var hints = {
        enterprise: "Tell us how many people will use the addon and which products you need.",
        upgrade: "Add the email address or the order number of your earlier purchase.",
        support: "Add your Blender version, the addon version and what you see."
      };

      function selectedTopic() {
        var option = topic.options[topic.selectedIndex];
        return option ? option.getAttribute("data-topic") : null;
      }

      function showHint() {
        var text = hints[selectedTopic()];
        hint.textContent = text || "";
        hint.hidden = !text;
      }

      if (topic && hint) {
        var wanted = new URLSearchParams(window.location.search).get("topic");
        if (wanted) {
          for (var i = 0; i < topic.options.length; i++) {
            if (topic.options[i].getAttribute("data-topic") === wanted.toLowerCase()) {
              topic.selectedIndex = i;
            }
          }
        }
        topic.addEventListener("change", showHint);
        showHint();
      }

      var controls = document.querySelectorAll(".artwork-control");
      function syncFilled(el) {
        var inp = el.querySelector(".artwork-input");
        if (!inp) return;
        el.classList.toggle("is-active", (inp.value || "").trim() !== "");
      }
      controls.forEach(function (el) {
        var inp = el.querySelector(".artwork-input");
        if (!inp) return;
        ["input", "change", "blur"].forEach(function (ev) {
          inp.addEventListener(ev, function () {
            syncFilled(el);
          });
        });
        syncFilled(el);
      });
    })();
  </script>
</body>
</html>
