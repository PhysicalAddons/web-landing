# Now starts MAIN REDIRECTS
# / is no longer redirected to /psa/ — the root landing page lives in this repo (index.html).

[[redirects]]
	from = "/psa/*"
	to = "https://web-psa.netlify.app/psa/:splat"
	status = 200
	force = true

[[redirects]]
	from = "/blog/*"
	to = "https://pa-blog.netlify.app/:splat"
	status = 200
	force = true

[[redirects]]
	from = "/this-is-a-secret"
	to = "https://web-redirect.netlify.app"
	status = 200
	force = true

[[redirects]]
	from = "/pco/*"
	to = "https://web-pco.netlify.app/:splat"
	status = 200
	force = true

[[redirects]]
	from = "/pow/*"
	to = "https://web-pow.netlify.app/:splat"
	status = 200
	force = true

# Physical Atmosphere² (new product) — docs built with base /physical-atmosphere/,
# but deployed at the root of web-pa.netlify.app, so the prefix is stripped here.
[[redirects]]
	from = "/physical-atmosphere/*"
	to = "https://web-pa.netlify.app/:splat"
	status = 200
	force = true

# Using privacy-first analytics (self-hosted Plausible). Do not want to be blocked.
[[redirects]]
	from = "/js/script.js"
	to = "https://stats.upitis.com/js/script.js"
	status = 200
	force = true

[[redirects]]
	from = "/api/event"
	to = "https://stats.upitis.com/api/event"
	status = 200
	force = true
