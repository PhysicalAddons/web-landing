# Old PSA MkDocs pages - removed from nav but were previously indexed by Google.
# 301 = permanent redirect, passes ranking authority to new URL.

# About → PSA landing
[[redirects]]
    from = "/psa/about/"
    to = "/psa/"
    status = 301
    force = true

# Overview + Presets + Updating → Getting Started
[[redirects]]
    from = "/psa/overview/"
    to = "/psa/getting-started/"
    status = 301
    force = true

[[redirects]]
    from = "/psa/presets/"
    to = "/psa/getting-started/"
    status = 301
    force = true

[[redirects]]
    from = "/psa/updating/"
    to = "/psa/getting-started/"
    status = 301
    force = true

# Atmosphere, Artistic Values, Features, Clouds, Stars, Ground, Old Docs → Documentation
