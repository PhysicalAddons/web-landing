#[build]
#// only build homepage
#command = "webpack" 


[[redirects]]
	from = "/"
	to = "/psa/"
	status = 301
	force = true

[[redirects]]
	from = "/psa/*"
	to = "https://web-psa.netlify.app/psa/:splat"
	status = 200
	force = true

[[redirects]]
	from = "/blog/*"
	to = "https://pa-blog.netlify.app/:splat"
	status = 200
	force = true

[[redirects]]
	from = "/this-is-a-secret"
	to = "https://web-redirect.netlify.app"
	status = 200
	force = true

#[[redirects]]
#	from = "/psa/*"
#	to = "https://web-psa.netlify.app/:splat"
#	status = 200
#	force = true

[[redirects]]
	from = "/pco/*"
	to = "https://web-pco.netlify.app/:splat"
	status = 200
	force = true

[[redirects]]
	from = "/pow/*"
	to = "https://web-pow.netlify.app/:splat"
	status = 200
	force = true

# Using privacy-first analytics. Do not want to be blocked.
[[redirects]]
	from = "/js/script.js"
	to = "https://plausible.io/js/script.js"
	status = 200
	force = true

[[redirects]]
	from = "/api/event"
	to = "https://plausible.io/api/event"
	status = 200
	force = true


# Old PSA MkDocs pages - removed from nav but were previously indexed by Google.
# 301 = permanent redirect, passes ranking authority to new URL.

# About → PSA landing
[[redirects]]
    from = "/psa/about/"
    to = "/psa/"
    status = 301
    force = true

# Overview + Presets → Getting Started
[[redirects]]
    from = "/psa/overview/"
    to = "/psa/getting-started/"
    status = 301
    force = true

[[redirects]]
    from = "/psa/presets/"
    to = "/psa/getting-started/"
    status = 301
    force = true

# Atmosphere, Artistic Values, Features, Clouds, Stars, Ground → Documentation
[[redirects]]
    from = "/psa/atmosphere/"
    to = "/psa/documentation/"
    status = 301
    force = true

[[redirects]]
    from = "/psa/artistic-values/"
    to = "/psa/documentation/"
    status = 301
    force = true

[[redirects]]
    from = "/psa/features/"
    to = "/psa/documentation/"
    status = 301
    force = true

[[redirects]]
    from = "/psa/clouds/"
    to = "/psa/documentation/"
    status = 301
    force = true

[[redirects]]
    from = "/psa/stars/"
    to = "/psa/documentation/"
    status = 301
    force = true

[[redirects]]
