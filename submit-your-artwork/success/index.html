<!DOCTYPE html>
<html class="not-ready dark artwork-root" style="--bg: #010101" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks — Physical Addons</title>
  <meta name="description" content="Thank you for submitting your artwork to Physical Addons." />
  <link rel="canonical" href="https://www.physicaladdons.com/submit-your-artwork/success/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://www.physicaladdons.com/blog/main.min.css" />
  <link rel="stylesheet" href="/submit-your-artwork/artwork.css" />
  <script defer data-domain="physicaladdons.com" src="/js/script.js"></script>
  <meta name="theme-color" content="#010101" />
  <meta name="robots" content="noindex" />
</head>
<body class="artwork-body text-black dark:text-white">
  <header class="site-header">
    <nav class="nav-primary nav-primary--closed" aria-label="Primary">
      <a class="nav-primary__logo" href="https://www.physicaladdons.com/psa/" aria-label="Physical Addons">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
          <path
            fill="currentColor"
            d="m266.669 400.001 133.333-66.666V216.668l-133.333 66.667v116.666ZM133.333 0 0 66.667V400l133.333-66.667v-66.666h133.334L400 200V0H133.333Zm0 100h133.334v66.667H133.333V100Z"
          />
        </svg>
      </a>
      <button
        class="nav-primary__toggle"
        aria-controls="primary-nav-links"
        aria-expanded="false"
        aria-label="Toggle primary navigation"
        type="button"
      >
        <svg class="ham" viewBox="0 0 100 100" width="64" aria-hidden="true">
          <path class="ham__line ham__line--top" d="m 70,33 h -40 c 0,0 -8.5,-0.149796 -8.5,8.5 0,8.649796 8.5,8.5 8.5,8.5 h 20 v -20"></path>
          <path class="ham__line ham__line--middle" d="m 70,50 h -40"></path>
          <path class="ham__line ham__line--bottom" d="m 30,67 h 40 c 0,0 8.5,0.149796 8.5,-8.5 0,-8.649796 -8.5,-8.5 -8.5,-8.5 h -20 v 20"></path>
        </svg>
      </button>
      <div class="nav-primary__collapse" id="primary-nav-links">
        <div class="nav-primary__main">
          <a href="https://www.physicaladdons.com/pco/" class="nav-primary__link">Planets</a>
          <a href="https://www.physicaladdons.com/psa/" class="nav-primary__link">Atmosphere</a>
          <a href="https://www.physicaladdons.com/pow/" class="nav-primary__link">Oceans</a>
        </div>
        <div class="nav-primary__secondary">
          <a href="/blog/" class="nav-primary__link nav-primary__link--muted">Blog</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="artwork artwork--success" id="top">
    <div class="artwork-main">
      <section class="artwork-thanks" aria-labelledby="thanks-title">
        <h1 class="artwork-thanks__title" id="thanks-title">Thanks!</h1>
        <p class="artwork-thanks__text">
          We have received your submission. We will contact you in case we need any extra info and to notify you when we
          schedule posting your amazing artwork.
        </p>
      </section>
    </div>
  </main>

  <script>
    setTimeout(function () {
      document.documentElement.classList.remove("not-ready");
    }, 10);
    var navPrimary = document.querySelector(".nav-primary");
    var btnMenu = document.querySelector(".nav-primary__toggle");
    if (navPrimary && btnMenu) {
      btnMenu.addEventListener("click", function () {
        var isExpanded = btnMenu.getAttribute("aria-expanded") === "true";
        var nextState = !isExpanded;
        btnMenu.setAttribute("aria-expanded", nextState ? "true" : "false");
        navPrimary.classList.toggle("nav-primary--open", nextState);
        navPrimary.classList.toggle("nav-primary--closed", !nextState);
        document.body.classList.toggle("navigation-active", nextState);
      });
    }
  </script>
</body>
</html>
